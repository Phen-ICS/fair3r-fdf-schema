name: Validate schema

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: FDF contract and regression tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate FDF contract and locale versions
        run: python tools/validate_schema.py
      - name: Test rejected configurations and semantic regressions
        run: python -m unittest discover -s tests -v
      - name: Validate locale coverage
        run: python tools/i18n.py check --locale fr
