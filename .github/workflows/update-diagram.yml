name: Update schema diagram

on:
  push:
    branches:
      - main
    paths:
      - "fdf_schema.json"
  workflow_dispatch: {}

jobs:
  regenerate:
    name: Regenerate docs/schema-diagram.md
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate diagram
        run: python tools/generate_diagram.py

      - name: Open a PR if the diagram changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- docs/schema-diagram.md; then
            echo "Diagram unchanged"
            exit 0
          fi

          BRANCH="auto/schema-diagram"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add docs/schema-diagram.md
          git commit -m "docs: regenerate schema diagram"
          git push --force origin "$BRANCH"

          if [ "$(gh pr list --head "$BRANCH" --state open --json number --jq 'length')" = "0" ]; then
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "docs: regenerate schema diagram" \
              --body "Auto-generated by \`tools/generate_diagram.py\` after a change to \`fdf_schema.json\` on \`main\`."
          else
            echo "PR already open on $BRANCH, updated via force-push"
          fi
