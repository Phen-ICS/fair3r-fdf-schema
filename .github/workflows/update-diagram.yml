name: Update schema diagram

on:
  push:
    branches:
      - main
    paths:
      - "fdf_schema.json"
  workflow_dispatch: {}

jobs:
  regenerate:
    name: Regenerate docs/schema-diagram.md
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate diagram
        run: python tools/generate_diagram.py

      - name: Open a PR if the diagram changed
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "docs: regenerate schema diagram"
          title: "docs: regenerate schema diagram"
          body: Auto-generated by `tools/generate_diagram.py` after a change to `fdf_schema.json` on `main`.
          branch: auto/schema-diagram
          add-paths: docs/schema-diagram.md
